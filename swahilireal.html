<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sophia AI Languages Tutorr</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
    #status {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

 <h1>Explore Africa</h1>
  <h2>Swahili Translator</h2>
  
  <!-- Text Input Fallback / Alternative -->
  <div class="input-group">
    <input type="text" id="textInput" placeholder="Type words or tap the mic...
    " />
    <button id="sendBtn">Send</button>
  </div>

  <!-- Speech Input -->
      <button id="micBtn" class="icon-btn" title="Search with voice" aria-label="Voice Search">
        <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"></path>
        </svg>
      </button>
  <p id="status">Status: Idle</p>
  

  <script>
    // 1. Audio Dictionary Mapping (Key Phrase -> Audio Source)
    // Replace these placeholder URLs with paths to your actual MP3/WebM files
    const audioMap = [
    { key: "how are you", src: "https://wisdomokubo1.github.io/jikoro/copyright/swahili1.opus" },
    { key: "what's up", src: "https://wisdomokubo1.github.io/jikoro/copyright/swahili2.opus" },
    { key: "nice to meet you", src: "https://wisdomokubo1.github.io/jikoro/copyright/swahili3.opus" },
    { key: "where are you from", src: "https://wisdomokubo1.github.io/jikoro/copyright/swahili4.opus" },
    { key: "how's it going", src: "https://wisdomokubo1.github.io/jikoro/copyright/swahili5.opus" },
    { key: "what do you do", src: "https://wisdomokubo1.github.io/jikoro/copyright/swahili6.opus" },
    { key: "i don't know", src: "https://wisdomokubo1.github.io/jikoro/copyright/swahili7.opus" },
    { key: "that's interesting", src: "https://wisdomokubo1.github.io/jikoro/copyright/swahili8.opus" },
    { key: "i agree", src: "https://wisdomokubo1.github.io/jikoro/copyright/swahili9.opus" },
    { key: "i disagree", src: "https://wisdomokubo1.github.io/jikoro/copyright/swahili10.opus" },
    ];

    const statusEl = document.getElementById('status');
    const textInput = document.getElementById('textInput');
    const sendBtn = document.getElementById('sendBtn');
    const micBtn = document.getElementById('micBtn');

    // Currently playing audio instance to prevent overlapping audio
    let currentAudio = null;

    // 2. Playback Handler (with Fuzzy Matching & Autoplay Safety)
    function processInput(rawText) {
      const cleanInput = rawText.toLowerCase().trim();
      statusEl.textContent = `User said: "${rawText}"`;

      // Find matching entry (fuzzy search: checks if user input contains any key phrase)
      const match = audioMap.find(item => cleanInput.includes(item.key));

      if (match) {
        // Stop currently playing audio if applicable
        if (currentAudio) {
          currentAudio.pause();
          currentAudio.currentTime = 0;
        }

        statusEl.textContent = `Matching and Playing audio...`;

        // Create and play audio object
        currentAudio = new Audio(match.src);
        currentAudio.play().catch(error => {
          console.error("Audio playback error:", error);
          statusEl.textContent = "Error: Click anywhere on the page first to allow audio playback.";
        });
      } else {
        statusEl.textContent = `No audio match found for "${rawText}".`;
      }
    }

    // 3. Text Input Handler
    sendBtn.addEventListener('click', () => {
      if (textInput.value) {
        processInput(textInput.value);
        textInput.value = '';
      }
    });

    textInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && textInput.value) {
        processInput(textInput.value);
        textInput.value = '';
      }
    });

    // 4. Web Speech API Setup for Real-Time Microphone Listening
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.lang = 'en-US';

      micBtn.addEventListener('click', () => {
        statusEl.textContent = "Listening...";
        recognition.start();
      });

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        processInput(transcript);
      };

      recognition.onerror = (event) => {
        statusEl.textContent = `Speech error: ${event.error}`;
      };

      recognition.onend = () => {
        if (statusEl.textContent === "Listening...") {
          statusEl.textContent = "Idle";
        }
      };
    } else {
      micBtn.disabled = true;
      micBtn.textContent = "🎤 Voice Recognition Not Supported";
      statusEl.textContent = "Web Speech API is not supported in this browser. Use text input above.";
    }
  </script>

</body>
</html>
