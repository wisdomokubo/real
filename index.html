<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voice & Text Audio Responder</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
    }
    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      font-size: 16px;
    }
    button {
      padding: 10px 15px;
      font-size: 16px;
      cursor: pointer;
    }
    #status {
      font-size: 14px;
      color: #555;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>Interactive Audio Trigger</h2>
  
  <!-- Text Input Fallback / Alternative -->
  <div class="input-group">
    <input type="text" id="textInput" placeholder="Type 'how are you' or click mic..." />
    <button id="sendBtn">Send</button>
  </div>

  <!-- Speech Input -->
  <button id="micBtn">🎤 Speak</button>

  <p id="status">Status: Idle</p>

  <script>
      
// 1. Double-check your actual file paths and extensions (.mp3, .wav, etc.)
const audioMap = {
  "how are you", src: "https://wisdomokubo1.github.io/jikoro/copyright/hausa1.mp3",
  "nice to meet you", src: "https://wisdomokubo1.github.io/jikoro/copyright/hausa3.m4a",
  "where are you from", src: "https://wisdomokubo1.github.io/jikoro/copyright/hausa4.m4a",
};

// Reusable audio element prevents memory leaks and handles state better
const player = new Audio();

function processInput(rawText) {
  const cleanInput = rawText.toLowerCase().trim();

  // Find the matching phrase key
  const matchedKey = Object.keys(audioMap).find(phrase => cleanInput.includes(phrase));

  if (matchedKey) {
    const audioSrc = audioMap[matchedKey];
    statusEl.textContent = `Loading audio for "${matchedKey}"...`;

    player.pause();
    player.src = audioSrc;
    player.load();

    player.play().catch(error => {
      statusEl.textContent = `Playback Failed: ${error.message}`;
    });
  } else {
    statusEl.textContent = `No matching audio found for: "${rawText}"`;
  }
}
    
  </script>

</body>
</html>
