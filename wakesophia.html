<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wake Sophia Test</title>
    <style>
        body { font-family: sans-serif; padding: 2rem; max-width: 600px; }
        #status { padding: 10px; margin-top: 20px; border-radius: 5px; background: #eee; }
        .listening { background: #d4edda !important; color: #155724; }
        .triggered { background: #f8d7da !important; color: #721c24; font-weight: bold; }
        .speaking { background: #cce5ff !important; color: #004085; }
        #responseOutput { margin-top: 15px; padding: 10px; border: 1px solid #ccc; min-height: 50px; }
        
        /* New styling for our dynamic link button */
        #navigateLink {
            display: none; 
            margin-top: 20px; 
            padding: 12px 20px; 
            background: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 5px;
            font-weight: bold;
            text-align: center;
        }
        #navigateLink:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h2>Sophia AI</h2>
    <p>Click start, allow microphone access, and say <strong>"Hello Sophia"</strong>.</p>
    
    <button id="startBtn">Start Listening</button>
    <button id="stopBtn" disabled>Stop</button>

    <div id="status">Microphone off.</div>
    <div id="transcriptOutput" style="margin-top: 15px; color: #555;">Waiting for wake word...</div>
    
    <h3>User Request:</h3>
    <div id="responseOutput"></div>

    <!-- The hidden button that will appear when a language is matched -->
    <a id="navigateLink" href="#" target="_blank">Open Language</a>

    <script>
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const synth = window.speechSynthesis;
        
        if (!SpeechRecognition || !synth) {
            alert("Your browser does not fully support the Web Speech API.");
        } else {
            const recognition = new SpeechRecognition();
            recognition.continuous = true; 
            recognition.interimResults = true; 
            recognition.lang = 'en-US';

            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const statusDiv = document.getElementById('status');
            const transcriptOutput = document.getElementById('transcriptOutput');
            const responseOutput = document.getElementById('responseOutput');
            const navigateLink = document.getElementById('navigateLink');
            
            let isListening = false;
            let isAwaitingResponse = false; 
            const WAKE_WORD = "hello sophia";

            const languageLinks = {
                "spanish": "https://wisdomokubo.github.io/real/spanishreal.html",
                "french": "https://wisdomokubo.github.io/real/frenchreal.html",
                "igbo": "https://wisdomokubo.github.io/real/igboreal.html",
                "hausa": "https://wisdomokubo.github.io/real/hausareal.html",
                "yoruba": "https://wisdomokubo.github.io/real/yorubareal.html"
            };

            startBtn.addEventListener('click', () => {
                startListening();
            });

            stopBtn.addEventListener('click', () => {
                isListening = false;
                isAwaitingResponse = false;
                recognition.stop();
                updateUI('off', 'Microphone off.');
            });

            function startListening() {
                try {
                    recognition.start();
                    isListening = true;
                    updateUI('listening', 'Listening for wake word...');
                } catch(e) {
                    // Ignore errors if it's already started
                }
            }

            function speakPrompt(text) {
                recognition.stop();
                updateUI('speaking', 'Assistant is speaking...');
                
                // Hide the button again when starting a new query
                navigateLink.style.display = "none";
                
                const utterance = new SpeechSynthesisUtterance(text);
                
                utterance.onend = () => {
                    isAwaitingResponse = true;
                    responseOutput.textContent = "Listening for your response...";
                    startListening();
                    updateUI('triggered', 'Listening for your command...');
                };

                synth.speak(utterance);
            }

            function handleLanguageRouting(transcript) {
                let foundLanguage = null;
                
                for (const lang in languageLinks) {
                    if (transcript.includes(lang)) {
                        foundLanguage = lang;
                        break;
                    }
                }

                if (foundLanguage) {
                    console.log(`Matched language: ${foundLanguage}`);
                    updateUI('listening', `Ready to open page for ${foundLanguage}.`);
                    
                    // Update the link properties and show it
                    const targetUrl = languageLinks[foundLanguage];
                    navigateLink.href = targetUrl;
                    
                    // Capitalize the first letter for the button text
                    const formattedLang = foundLanguage.charAt(0).toUpperCase() + foundLanguage.slice(1);
                    navigateLink.textContent = `Open ${formattedLang}`;
                    navigateLink.style.display = "inline-block";
                    
                    // Tell the user to click the button
                    const confirmUtterance = new SpeechSynthesisUtterance(`I found ${foundLanguage}. Click the button to open it.`);
                    synth.speak(confirmUtterance);
                    
                } else {
                    console.log("No matching language found in:", transcript);
                    updateUI('listening', 'Language not recognized. Returning to wake word mode...');
                    
                    navigateLink.style.display = "none";
                    
                    const errorUtterance = new SpeechSynthesisUtterance(`I don't have a link for that language.`);
                    synth.speak(errorUtterance);
                }
            }

            recognition.onresult = (event) => {
                let currentTranscript = "";
                let isFinal = false;
                
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    currentTranscript += event.results[i][0].transcript.toLowerCase();
                    if (event.results[i].isFinal) {
                        isFinal = true;
                    }
                }
                
                if (isAwaitingResponse) {
                    responseOutput.textContent = currentTranscript;
                    
                    if (isFinal) {
                        isAwaitingResponse = false;
                        handleLanguageRouting(currentTranscript.trim());
                        transcriptOutput.textContent = "Waiting for wake word...";
                    }
                } else {
                    transcriptOutput.textContent = `Heard: "${currentTranscript}"`;

                    if (currentTranscript.includes(WAKE_WORD)) {
                        speakPrompt("What Language do you want to Translate?");
                    }
                }
            };

            recognition.onend = () => {
                if (isListening && !synth.speaking) {
                    recognition.start();
                }
            };

            function updateUI(state, message) {
                statusDiv.textContent = message;
                statusDiv.className = state;
                startBtn.disabled = (state !== 'off');
                stopBtn.disabled = (state === 'off');
            }
        }
    </script>
</body>
</html>
